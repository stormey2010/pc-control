name: Build iOS and upload to TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pc-control-testflight
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: JUV7448PYM
      IOS_BUNDLE_ID: app.pccontrol.remote
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      FASTLANE_DONT_STORE_PASSWORD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Prepare native project and build tools
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec ios/PCControl/project.yml
          bundle install --gemfile ios/Gemfile
          echo "IOS_BUILD_NUMBER=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Archive, sign, and upload (no tests)
        working-directory: ios
        env:
          SIGNING_JSON: ${{ secrets.PC_CONTROL_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SIGNING_JSON"
          SIGNING_DIR="$(mktemp -d "$RUNNER_TEMP/pccontrol-signing.XXXXXX")"
          export PC_CONTROL_SIGNING_BUNDLE="$SIGNING_DIR/signing.json"
          printf '%s' "$SIGNING_JSON" > "$PC_CONTROL_SIGNING_BUNDLE"
          unset SIGNING_JSON
          bundle exec fastlane ios beta
      - name: Keep signed app
        uses: actions/upload-artifact@v4
        with:
          name: PC-Control-TestFlight-${{ github.run_number }}-${{ github.run_attempt }}
          path: ios/build/*.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Keep build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PC-Control-Build-Logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: ~/Library/Logs/gym/*.log
          retention-days: 3
          if-no-files-found: ignore
      - name: Remove temporary signing material
        if: always()
        run: |
          find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'pccontrol-signing.*' -exec rm -rf -- {} +
          security delete-keychain pccontrol_build-db 2>/dev/null || true
