name: PCControl
options:
  bundleIdPrefix: app.pccontrol
  deploymentTarget:
    iOS: '17.0'
packages:
  RemoteCore:
    path: ../Packages/RemoteCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: JUV7448PYM
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PCControl:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: RemoteCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pccontrol.remote
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
schemes:
  PCControl:
    build:
      targets:
        PCControl: all
    archive:
      config: Release
